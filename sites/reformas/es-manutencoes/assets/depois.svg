<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Arial, sans-serif">
  <!-- PLACEHOLDER: parede DEPOIS do serviço (efeito 01, camada de baixo).
       Substituir por case-depois.jpg real do cliente ou via ASSETS_PROMPT.md.
